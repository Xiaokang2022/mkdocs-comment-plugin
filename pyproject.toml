[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-comment-plugin"
version = "1.0.0"
description = "Material 风格的 MkDocs 评论区插件，支持 Markdown、表情互动与统计，配套独立 REST 后端"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CommentPlugin" }]
keywords = ["mkdocs", "mkdocs-plugin", "comments", "material"]
classifiers = [
  "Framework :: MkDocs",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
]
dependencies = ["mkdocs>=1.4"]

[project.optional-dependencies]
server = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "markdown>=3.5",
  "bleach>=6.1",
]
dev = ["mkdocs-material>=9.5"]

[project.entry-points."mkdocs.plugins"]
comment = "mkdocs_comment_plugin.plugin:CommentPlugin"

[project.urls]
Homepage = "https://github.com/example/mkdocs-comment-plugin"

[tool.setuptools]
packages = ["mkdocs_comment_plugin"]

[tool.setuptools.package-data]
mkdocs_comment_plugin = ["assets/*.css", "assets/*.js"]
